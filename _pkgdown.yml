url: https://www.okanbulut.com/synthcheck/

template:
  bootstrap: 5
  light-switch: false
  bslib:
    primary: "#1c5cab"
    navbar-bg: "#10213d"
    link-color: "#1c5cab"
    link-hover-color: "#10213d"
    headings-color: "#10213d"
    code-color: "#1c5cab"

navbar:
  type: dark
  structure:
    left: [intro, tutorials, app, reference, news]
  components:
    intro:
      text: Get started
      href: articles/synthcheck.html
    tutorials:
      text: Tutorials
      menu:
      - text: "Overlap and Structure: The coverage strip"
        href: articles/overlap-structure.html
      - text: "Behaviour: How synthetic respondents answer"
        href: articles/behaviour.html
      - text: The synthetic authenticity benchmark
        href: articles/benchmark.html
      - text: Diagnostics beside the benchmark
        href: articles/diagnostics.html
      - text: Pretesting a scale without real data
        href: articles/pretest.html
      - text: Generating synthetic respondents in R
        href: articles/generate.html
      - text: Short instruments with known item problems
        href: articles/instruments.html
      - text: Cognitive interviews with language models
        href: articles/cognitive-interviews.html
    app:
      text: The app
      menu:
      - text: A tour of the synthcheck app
        href: articles/app-tour.html
      - text: "App demos: Four ways to use the app"
        href: articles/app-demo.html

articles:
- title: Get started
  navbar: ~
  contents:
  - articles/synthcheck
- title: Tutorials
  desc: One step of the workflow at a time, with the functions behind it.
  contents:
  - articles/overlap-structure
  - articles/behaviour
  - articles/benchmark
  - articles/diagnostics
  - articles/pretest
  - articles/generate
  - articles/instruments
  - articles/cognitive-interviews
- title: The synthcheck app
  desc: The whole workflow on screen, from an instrument to a benchmark.
  contents:
  - articles/app-tour
  - articles/app-demo

reference:
- title: Overlap and Structure
  desc: Where synthetic respondents land and how their items relate.
  contents:
  - synthetic_coverage
  - gg_coverage
  - blend_llms
- title: Behaviour
  desc: How synthetic respondents answer.
  contents:
  - synthetic_behaviour
  - gg_behaviour
  - behaviour_features
  - flag_careless
- title: The synthetic authenticity benchmark
  contents:
  - authenticity_benchmark
  - gg_benchmark
  - summarise_benchmark
- title: Diagnostics
  desc: Checks beside the benchmark that do not change its score.
  contents:
  - synthetic_construct
  - gg_construct
  - respondent_coverage
  - gg_respondent_coverage
  - synthetic_copula
- title: Pretest without real data
  desc: Pilot screening of a scale on synthetic respondents alone, with agreement across conditions.
  contents:
  - synthetic_pretest
  - gg_pretest
  - summarise_pretest
- title: Generating synthetic respondents
  desc: Define an instrument and personas, call language models, save the data.
  contents:
  - run_synthcheck_app
  - sc_instrument
  - sc_builtin_instrument
  - sc_personas
  - sc_model
  - sc_default_models
  - sc_prompt
  - generate_synthetic
  - write_synthetic
  - as_synthetic_list
- title: Cognitive interviews
  desc: Screen item wording with language models playing personas, when there are no real respondents yet.
  contents:
  - cognitive_interview
  - sc_probes
  - sc_interview_prompts
  - summarise_interviews
  - gg_interview
- title: Data
  contents:
  - hexaco_real
  - hexaco_llm
  - hexaco_items
  - rses
  - dass
  - mini_ipip
- title: Helpers
  contents:
  - theme_synthcheck
  - synthcheck-package
